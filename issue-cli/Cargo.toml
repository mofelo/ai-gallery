[package]
name = "ai-gallery-cli"
version = "0.1.0"
edition = "2021"
description = "AI Gallery CLI — upload images, parse PNG metadata, create records via Worker API"

[[bin]]
name = "ai-gallery-cli"
path = "src/main.rs"

[dependencies]
ai-gallery-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
png = "0.18"
flate2 = "1"
dotenv = "0.15"
urlencoding = "2"