[package]
name = "ai-gallery-worker"
version = "0.1.0"
edition = "2021"
description = "AI Gallery API Worker — Rust + workers-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http", "axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ai-gallery-core = { path = "../core", default-features = false, features = ["worker"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"